name: Update next event

on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write          # push the bot/next-event branch
  pull-requests: write     # open/update the pull request

concurrency:
  group: update-next-event
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # If a PR is already open, start from its version of the file, so a
      # description someone edited in that PR is kept instead of overwritten.
      - name: Use the open PR's file, if any
        run: |
          if git fetch --depth=1 origin bot/next-event 2>/dev/null; then
            git show FETCH_HEAD:public/next-event.txt > public/next-event.txt
          fi

      - name: Fetch next event from Meetup
        id: event
        run: |
          python3 scripts/update_next_event.py public/next-event.txt
          echo "date=$(sed -n 2p public/next-event.txt)" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/next-event
          delete-branch: true
          add-paths: public/next-event.txt
          commit-message: Update next-event to ${{ steps.event.outputs.date }}
          title: Update next event to ${{ steps.event.outputs.date }}
          body: |
            The next upcoming event on [Meetup](https://www.meetup.com/groningenphp/events/) has changed.

            Check `public/next-event.txt` (the description is shortened automatically; feel free to edit it in this PR), then approve and merge. Merging deploys the site.

            _Opened automatically by the "Update next event" workflow._
